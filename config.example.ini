# ==============================================================================
# BareStats - Configuration Reference
# ==============================================================================
# BareStats searches for this configuration in:
#   Windows:
#     1. Portable Mode: <exe_directory>\config.ini (if directory is writable)
#     2. Installed Mode: %LOCALAPPDATA%\BareStats\config.ini (when installed in Program Files)
#   macOS:
#     1. Portable Mode: <app_bundle>/Contents/MacOS/config.ini (or next to binary)
#     2. Standard Mode: ~/Library/Application Support/BareStats/config.ini
#   Linux:
#     1. Current Working Directory: ./config.ini
#     2. Portable Mode: <exe_directory>/config.ini
#     3. Standard Mode: ~/.config/barestats/config.ini (or $XDG_CONFIG_HOME/barestats/config.ini)
#
# All values have compiled-in defaults and will fall back gracefully if omitted.

[BareStats]
# Configuration schema version. Used for automated near-zero-overhead in-place migrations.
schema_version = 140

[General]
# Run mode: 0 = Desktop GUI Overlay (default), 1 = Silent Headless Daemon (Windows, macOS, Linux)
headless = 0

# System tray / menu bar / top panel icon (1 = enabled, 0 = disabled)
#   Windows: System Tray Notification Area
#   macOS:   Top Menu Bar (NSStatusItem)
#   Linux:   AppIndicator / StatusNotifierItem top panel indicator
show_tray_icon = 1

[Position]
# Target monitor display index (0 = primary display, 1 = secondary) (Windows, macOS, Linux)
monitor_index = 0

# Position preset:
#   top-left, top-center, top-right
#   center-left, center, center-right
#   bottom-left, bottom-center, bottom-right
#   custom
preset = bottom-center

# Absolute screen coordinates in pixels (active when preset = custom)
custom_x = -1
custom_y = -1

# Monitor-relative coordinates (persisted automatically when using Drag-to-Reposition)
# Keeps the overlay perfectly anchored across screen resolution or display changes.
custom_rel_x = -1
custom_rel_y = -1

# Screen boundary margin in pixels (padding from display edges or taskbars)
margin = 12

[Layout]
# Layout presentation mode: (Windows, macOS, Linux)
#   horizontal  = Single-line horizontal status ribbon driven by 'order' below
#   grid        = Compact multi-row widget (Row 0 follows non-GPU 'order', subsequent rows wrap GPUs)
#   custom_grid = 2D matrix layout defined explicitly via grid_row_* below
mode = horizontal

# Metric display sequence (used for 'horizontal' ribbon and Row 0 of 'grid'):
# Tokens: CPU, GPU, RAM, NET, LLM, or remote cluster tokens (e.g. rig1:cpu, rig1:gpu, rig1:llm)
order = CPU, GPU, RAM, NET

# Maximum GPUs displayed per row when layout = grid or multi-GPU wrapping is active (default: 2)
max_gpus_per_row = 2

# Custom Matrix Grid options (active when mode = custom_grid):
# grid_mode:
#   unified (default)    = Single compact layered window (lowest memory for closely-packed matrix grids)
#   islands              = Distributed micro-windows [Windows only: true OS-level click-through & per-monitor DPI]
grid_mode = unified
cell_gap = 16
row_gap = 4

# Custom Matrix Grid rows (active when mode = custom_grid):
# Use '.' or 'null' for empty slots. Repeat adjacent tokens on a row to merge columns (colspan).
# Or use explicit span syntax: e.g. gpu0:span(2) or gpu0:2
# Available widgets: cpu, ram, net, gpu (or gpu0, gpu1, gpu2...)
# Sub-metric widgets: cpu_util, cpu_temp, cpu_power, cpu_fan, ram_used, ram_pct,
#                     gpu0_util, gpu0_vram, gpu0_temp, gpu0_power, gpu0_fan, net_rx, net_tx
#
# Default compact 2-row template:
# grid_row_1 = cpu | ram | net
# grid_row_2 = gpu
#
# Visual 4x4 Matrix Example:
#   grid_row_1 = cpu  | .    | .    | ram
#   grid_row_2 = .    | .    | gpu0 | gpu0
#   grid_row_3 = gpu1 | gpu1 | gpu1 | gpu1
#   grid_row_4 = .    | net  | net  | net

[Appearance]
# Font face family (use "auto" or "system" to dynamically resolve system UI font)
#   Windows: Segoe UI
#   macOS:   San Francisco (.AppleSystemUIFont)
#   Linux:   System fontconfig sans-serif
font_name = auto

# Font weight: semibold (default, matches Windows Taskbar & macOS status items), regular, bold
font_weight = semibold

# Font size in pixels at standard 96 DPI / 1x scale (Per-Monitor V2 and Retina scale automatically)
font_size = 13

# Text color for numeric values and units in hex (#RRGGBB) - bright crisp white
text_color = #FFFFFF

# Label color for subsystem titles (CPU, GPU, RAM) in hex (#RRGGBB) - soft muted silver
label_color = #A0A0A0

# Divider bar color in hex (#RRGGBB) - quiet subtle divider
separator_color = #6E6E6E

# Alert color for elevated/high load (yellow, default: #FFD700)
color_high = #FFD700

# Alert color for critical load / thermal limits (red, default: #FF4D4D)
color_critical = #FF4D4D

# Enable dynamic color highlighting when thresholds are reached (1 = on, 0 = off)
enable_dynamic_colors = 1

# Dark contrast drop-shadow behind text for readability over pure white windows (1 = on, 0 = off)
drop_shadow = 1

# Symbol style for telemetry divider and network rate arrows:
#   auto    = Auto-detect font glyph capability (falls back to ASCII if font lacks glyphs)
#   ascii   = Force pure ASCII (|, v, ^) - guarantees zero tofu blocks on any font
#   unicode = Force Unicode (│, ↓, ↑)
symbol_style = auto

# Telemetry category divider symbol (e.g. │, |, •, /, -, ::)
# Default: │ (Unicode \u2502 box drawings light vertical; automatically falls back to | if font lacks │)
# If set to empty or "none" (separator = none), no divider is rendered.
separator = │

# Global overlay window opacity percentage (10 to 100, default: 100) (Windows, macOS, Linux)
opacity = 100

[Telemetry]
# Telemetry sampling interval in milliseconds (default: 1000 = 1 second)
# Polling automatically suspends to 0% CPU when screen sleeps to save laptop battery.
refresh_interval_ms = 1000

# Selected GPU device index:
#   0 (default) = Primary display adapter
#   1           = Secondary adapter
#   0, 1        = Simultaneous side-by-side multi-GPU monitoring (e.g. │ GPU0 ... │ GPU1 ... │)
#   all         = Monitor all discovered physical GPUs simultaneously
# Note: On Windows DXGI, GPU 0 is the adapter driving the primary display (often iGPU on laptops).
#       On macOS Apple Silicon, monitors the integrated M-series GPU core.
gpu_index = 0

# VRAM capacity reporting mode:
#   physical (default) = Gross hardware silicon capacity (e.g. 16.0 GB), matching retail packaging.
#   usable             = Net allocatable capacity excluding driver/firmware carve-outs (e.g. 15.6 GB).
#                        Prevents unexpected CUDA Out of Memory (OOM) errors during local LLM loads.
vram_mode = physical

# iGPU / On-Board Graphics / UMA Memory Reporting Mode:
#   usage     (default) = Shows true active memory usage without misleading total capacity.
#                         Appends [S] when allocations spill past BIOS aperture into shared system RAM.
#   shared              = Shows active usage against the full shared system memory pool.
#   dedicated           = Strictly bounds reporting to the BIOS dedicated aperture.
igpu_vram_mode = usage

# Background collector switches (1 = enabled, 0 = disabled)
# Note: Metrics present in active layout automatically collect. These toggles force background collection
# for UDP cluster streaming or logging even when omitted from the visible desktop layout.
show_cpu = 1
show_gpu = 1
show_ram = 1
show_net = 0

# GPU sensor toggles
show_gpu_temp = 1
show_gpu_power = 1
show_gpu_fan = 1

# Memory format toggle:
#   1 = show used/total (e.g. 12.3/16GB)
#   0 = show used only  (e.g. 12.3GB)
show_max_memory = 1

# Completely hide telemetry subsystems if hardware/driver is offline (1 = hide, 0 = show unavailable)
hide_offline_metrics = 0

# ==============================================================================
# Optional Per-Adapter Overrides (Hierarchical Per-GPU Customization)
# ==============================================================================
# Any GPU index can define an optional section [GPU0], [GPU1], etc.
# Values omitted in a per-GPU section automatically inherit global [Telemetry] defaults.
#
# [GPU0]
# show_util = 1
# show_vram = 1
# show_temp = 1
# show_power = 1
# show_fan = 1
# label = Primary
#
# [GPU1]
# show_util = 1
# show_vram = 1
# show_temp = 1
# show_power = 0
# show_fan = 0
# label = Compute

# ==============================================================================
# Encrypted Distributed Cluster & Satellite Architecture
# ==============================================================================
[Cluster]
# Control Center Master Private Key (Curve25519 256-bit secret, 64 hex characters)
# Auto-generated when clicking "Export satellite.ini" in tray or running barestats --export-satellite.
# Remote satellites receive only the derived Public Key; this Private Key never leaves the Control Center.
# cluster_key = <64-hex-private-key>
listen_port = 9889

[Cluster.Aliases]
# Custom display aliases for remote cluster rigs on this Control Center:
# Maps remote rig_id from incoming UDP packets to friendly display names:
# rig1 = MacMini1
# rig2 = LinuxWorkstation

# ==============================================================================
# AI Inference & LLM Engine Telemetry
# ==============================================================================
[LLM]
# Master switch for AI telemetry scrapers (1 = enabled, 0 = disabled)
enabled = 1

# Multi-vendor HTTP scrapers (comma or semicolon separated):
# Supports Ollama (/api/ps), vLLM (/metrics), llama.cpp (/slots, /metrics), TGI (/metrics), SGLang (/metrics)
endpoints = local=http://127.0.0.1:11434, local=http://127.0.0.1:8080, local=http://127.0.0.1:8000, local=http://127.0.0.1:1234, local=http://127.0.0.1:38111

# Scraper network timeout in milliseconds (300ms default prevents asyncio/GIL stalls)
timeout_ms = 300

# Polling frequency in milliseconds
poll_interval_ms = 1000

# Exponential backoff retry interval after server becomes unreachable
retry_interval_ms = 10000

# 3-second burst hold: retains last peak generation speed with (Done) state after completion
decay_hold_sec = 3

# Condensed model name badge length limit (default: 16 characters)
max_model_len = 16

# Filter out non-generative embedding models (e.g. nomic-embed, bge)
filter_embeddings = 1

# Minimum VRAM floor in MB to qualify as active LLM residency
min_vram_mb = 500

# Targeting strategy: 'active' targets generating model; '0', '1' targets specific slot index
target_model = active

[LLM.Aliases]
# Friendly display aliases for long model names (case-insensitive substring match)
# Maps 40-60 character server model identifiers down to clean compact badges:
# deepseek-r1-distill-qwen-14b = R1-14B
# llama-3.3-70b-instruct = Llama-3.3
