# ==============================================================================
# BareStats - Configuration Reference
# ==============================================================================
# BareStats searches for this configuration in:
#   1. Portable Mode: <exe_directory>\config.ini (if directory is writable)
#   2. Installed Mode: %LOCALAPPDATA%\BareStats\config.ini (when installed in Program Files)
#
# All values have compiled-in defaults and will fall back gracefully if omitted.

[Position]
# Target monitor display index (0 = primary monitor, 1 = secondary, etc.)
monitor_index = 0

# Position preset:
#   top-left, top-center, top-right
#   center-left, center, center-right
#   bottom-left, bottom-center, bottom-right
#   custom
preset = bottom-center

# Absolute screen coordinates in pixels (active when preset = custom)
custom_x = -1
custom_y = -1

# Monitor-relative coordinates (persisted automatically when using Drag-to-Reposition)
# Keeps the overlay perfectly anchored across screen resolution or display changes.
custom_rel_x = -1
custom_rel_y = -1

# Screen boundary margin in pixels (padding from display edges or taskbars)
margin = 12

[Appearance]
# Font face family (use "auto" or "system" to dynamically use Windows system UI font)
# Examples: auto, Segoe UI, Consolas, Cascadia Code, Bahnschrift
font_name = auto

# Font weight: semibold (default, matches Windows Taskbar & NVIDIA Overlay), regular, bold
font_weight = semibold

# Font size in pixels at standard 96 DPI (default: 13, Per-Monitor V2 scales automatically)
font_size = 13

# Text color for numeric values and units in hex (#RRGGBB) - bright crisp white
text_color = #FFFFFF

# Label color for subsystem titles (CPU, GPU, RAM) in hex (#RRGGBB) - soft muted silver
label_color = #A0A0A0

# Divider bar color in hex (#RRGGBB) - quiet subtle divider
separator_color = #6E6E6E

# Alert color for elevated/high load (yellow, default: #FFD700)
color_high = #FFD700

# Alert color for critical load / thermal limits (red, default: #FF4D4D)
color_critical = #FF4D4D

# Enable dynamic color highlighting when thresholds are reached (1 = on, 0 = off)
enable_dynamic_colors = 1

# Dark contrast drop-shadow behind text for readability over pure white windows (1 = on, 0 = off)
drop_shadow = 1

# Telemetry category divider symbol (e.g. │, |, •, /, -, ::)
# Default: │ (Unicode \u2502 box drawings light vertical)
separator = │

# Global overlay window opacity percentage (10 to 100, default: 100)
# Applied directly via Win32 Desktop Window Manager hardware alpha blending
opacity = 100

[Telemetry]
# Telemetry sampling interval in milliseconds (default: 1000 = 1 second)
# Polling automatically suspends to 0% CPU when screen sleeps to save laptop battery.
refresh_interval_ms = 1000
 
# Selected GPU device index:
#   0 (default) = Primary display adapter (GPU driving the primary desktop display)
#   1           = Secondary adapter (e.g. discrete rendering GPU or secondary display adapter)
#   0, 1        = Simultaneous side-by-side multi-GPU monitoring (e.g. │ GPU0 ... │ GPU1 ... │)
#   all         = Monitor all discovered physical GPUs simultaneously
# Note: In Windows DXGI enumeration, GPU 0 is the adapter driving the primary display.
#       On systems where displays plug into motherboard outputs or on hybrid laptops,
#       GPU 0 is typically the integrated GPU (iGPU) and GPU 1 is the discrete GPU (dGPU).
#       Run `BareStats.exe --test` in a terminal to inspect your system's exact adapter index mapping.
gpu_index = 0

# VRAM capacity reporting mode:
#   physical (default) = Gross hardware silicon capacity (e.g. 16.0 GB), matching retail packaging and Task Manager.
#   usable             = Net allocatable capacity excluding driver/firmware carve-outs (total - reserved e.g. 15.6 GB).
#                        Prevents unexpected CUDA Out of Memory (OOM) errors during local LLM (Ollama, PyTorch, vLLM) loads.
vram_mode = physical

# Metric segment display ordering (comma-separated list of CPU, GPU, RAM, NET)
# Custom order examples: "RAM, GPU, CPU", "NET, CPU, GPU, RAM", or "CPU, RAM"
order = CPU, GPU, RAM, NET

# Subsystem display toggles (1 = enabled, 0 = disabled)
show_cpu = 1
show_gpu = 1
show_ram = 1

# Optional network telemetry toggle (1 = show throughput e.g. NET 1.2M↓ 0.4M↑, 0 = disabled)
# Uses zero-driver Windows native GetIfTable2 API with automatic filtering of virtual/WSL/VPN adapters.
show_net = 0

# GPU metric toggles (NVIDIA NVML with automatic DXGI fallback)
show_gpu_temp = 1
show_gpu_power = 1
show_gpu_fan = 1

# Memory format toggle:
#   1 = show used/total (e.g. 12.3/16GB)
#   0 = show used only  (e.g. 12.3GB)
show_max_memory = 1

# Completely hide telemetry subsystems if hardware/driver is offline (1 = hide, 0 = show unavailable)
hide_offline_metrics = 0
