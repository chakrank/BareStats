# BareStats (TinyMonitor) Configuration

[Position]
# Selected monitor index (0 is primary)
monitor_index = 0

# Preset positions:
# top-left, top-center, top-right
# center-left, center, center-right
# bottom-left, bottom-center, bottom-right
# custom
preset = bottom-center

# Custom coordinates (used when preset = custom or after Ctrl+Alt+M drag)
custom_x = -1
custom_y = -1

# Edge margin in pixels
margin = 12

[Appearance]
font_name = Consolas
font_size = 14
# Text color in hex (#RRGGBB)
text_color = #DCDCDC
# Subtle dark drop-shadow for contrast over white windows (1 = enabled, 0 = disabled)
drop_shadow = 1

[Telemetry]
# Update interval in milliseconds
refresh_interval_ms = 1000

# Toggle specific metrics (1 = show, 0 = hide)
show_cpu = 1
show_gpu = 1
show_ram = 1
show_gpu_temp = 1
show_gpu_power = 1
show_gpu_fan = 1
