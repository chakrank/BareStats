name: CI - Build & Verification Matrix

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, windows-2022 ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja Build System
        uses: ashutoshvarma/setup-ninja@master

      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Compile Release Binary
        run: |
          cmake --build build --config Release

      - name: Execute Automated Verification & Benchmarks
        shell: cmd
        run: |
          build\BareStats.exe --test

      - name: Generate SHA-256 Checksum
        shell: powershell
        run: |
          $hash = (Get-FileHash -Path build/BareStats.exe -Algorithm SHA256).Hash
          Write-Output "BareStats.exe SHA-256: $hash"
          "$hash  BareStats.exe" | Out-File -FilePath build/BareStats.exe.sha256 -Encoding ascii

      - name: Upload Release Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: BareStats-Windows-x64
          path: |
            build/BareStats.exe
            build/BareStats.exe.sha256
          if-no-files-found: error
