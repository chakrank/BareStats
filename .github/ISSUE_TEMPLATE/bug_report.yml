name: Bug Report
description: Create a report to help us improve BareStats
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check existing issues first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Launch BareStats with default configuration
        2. Press 'Ctrl + Shift + M'
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating System Version
      description: E.g., Windows 11 24H2 (Build 26100), Windows 10 22H2.
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Hardware Configuration
      description: CPU, GPU model(s), and monitor resolution/scaling percentage.
      placeholder: "Ryzen 7 7800X3D, RTX 4080 (Driver 560.xx), Dual 1440p (100% scale)"
    validations:
      required: false

  - type: textarea
    id: test-output
    attributes:
      label: CLI Diagnostics Output
      description: Run `BareStats.exe --test` in Command Prompt and paste the terminal output here.
      render: shell
    validations:
      required: false
